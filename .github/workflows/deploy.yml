name: Deploy

# Production is deployed only from here (Vercel's own Git auto-deploy for main is off, see vercel.json):
# CI green on main -> migrations -> deploy -> smoke test. If any step fails, nothing newer goes live.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci

      - name: AC23 production must not hold bypass credentials
        run: |
          vars="$(npx vercel env ls production --token "$VERCEL_TOKEN")"
          for name in SUPABASE_SERVICE_ROLE_KEY DATABASE_URL_MIGRATE; do
            if grep -qw "$name" <<<"$vars"; then echo "::error::$name is defined in Vercel production"; exit 1; fi
          done

      # Migrations run before the new code is live, so they must be expand/contract (never drop or rename in the same deploy).
      # drizzle applies each migration in a transaction; there are no down migrations: fix forward.
      - name: Migrate production database
        run: npm run db:migrate
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.PROD_DATABASE_URL_MIGRATE }}

      - name: Build and deploy
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - run: npx playwright install --with-deps chromium
      - name: Smoke test production
        run: npx playwright test -c playwright.smoke.config.ts
        env:
          SMOKE_URL: ${{ vars.PROD_URL }}
